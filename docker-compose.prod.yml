version: "3.9"

services:
  nginx:
    image: nginx:alpine
    container_name: quantyx_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend

  mysql:
    image: mysql:8.0
    container_name: quantyx_mysql_prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_prod_data:/var/lib/mysql
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      --innodb-buffer-pool-size=1G
      --max-connections=500
      --slow-query-log=ON
      --slow-query-log-file=/var/log/mysql/slow.log
      --long-query-time=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5

  mysql-replica:
    image: mysql:8.0
    container_name: quantyx_mysql_replica
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_replica_data:/var/lib/mysql
    command: >
      --server-id=2
      --relay-log=relay-bin
      --read-only=1

  redis:
    image: redis:7-alpine
    container_name: quantyx_redis_prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_prod_data:/data

  backend:
    image: quantyx-backend:latest
    container_name: quantyx_backend_prod
    restart: always
    env_file: .env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      DEBUG: "false"
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: quantyx-frontend:latest
    container_name: quantyx_frontend_prod
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: https://api.quantyx.ai

volumes:
  mysql_prod_data:
  mysql_replica_data:
  redis_prod_data:
